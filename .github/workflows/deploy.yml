name: Deploy to GitHub Pages
on:
  push:
    branches: [pages]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npx ng build --base-href /soralyx-demo/
        working-directory: demo
      - run: cp demo/dist/soralyx-tms/browser/index.html demo/dist/soralyx-tms/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/dist/soralyx-tms/browser
      - id: deployment
        uses: actions/deploy-pages@v4
