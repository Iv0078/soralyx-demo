<header class="appbar">
  <div class="ab-left">
    <a class="brand" routerLink="/quotes"><soralyx-logo variant="light" [size]="24"></soralyx-logo></a>
    <nav class="nav">
      @for (m of navMenus; track m.label; let i = $index) {
        <div class="nav-menu">
          <span class="nav-item" [class.active]="isMenuActive(m)" [class.open]="openMenu() === i" (click)="toggleMenu(i, $event)">
            {{ m.label }}
            <svg class="caret" [class.up]="openMenu() === i" width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" [attr.stroke]="isMenuActive(m) ? 'rgba(255,255,255,.9)' : 'rgba(255,255,255,.6)'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          @if (openMenu() === i) {
            <div class="dropdown" (click)="$event.stopPropagation()">
              @for (it of m.items; track it.name) {
                <a class="dd-item" [class.sel]="isItemActive(it.link)" [routerLink]="it.link" (click)="onItemClick()">
                  <span>{{ it.name }}</span>
                  @if (isItemActive(it.link)) {
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M5 12l4.5 4.5L19 7" stroke="#6E6FFD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                  }
                </a>
              }
            </div>
          }
        </div>
      }
    </nav>
  </div>

  <div class="ab-right">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="rgba(255,255,255,.7)" stroke-width="1.7"/><path d="M20 20l-3.5-3.5" stroke="rgba(255,255,255,.7)" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span>Search load or carrier</span>
    </div>
    <div class="bell">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M14 21a2 2 0 0 1-4 0" stroke="rgba(255,255,255,.85)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="dot"></span>
    </div>

    <!-- account menu -->
    <div class="account">
      <button class="avatar" (click)="toggleAccount($event)">{{ initial }}</button>
      @if (accountOpen()) {
        <div class="acc-menu" (click)="$event.stopPropagation()">
          <div class="acc-head">
            <div class="acc-av">{{ initial }}</div>
            <div class="acc-id">
              <span class="acc-name">{{ user }}</span>
              <span class="acc-mail">{{ user }}&#64;soralyx.com</span>
            </div>
          </div>
          <div class="acc-sep"></div>
          <button class="acc-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke="#737b8c" stroke-width="1.6"/><path d="M4 20c0-3.3 3.6-6 8-6s8 2.7 8 6" stroke="#737b8c" stroke-width="1.6" stroke-linecap="round"/></svg>My account</button>
          <button class="acc-item"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="#737b8c" stroke-width="1.6"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.7-1l-.4-2.6h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L4 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1z" stroke="#737b8c" stroke-width="1.4" stroke-linejoin="round"/></svg>Settings</button>
          <div class="acc-sep"></div>
          <button class="acc-item danger" (click)="signOut()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 12H4M8 8l-4 4 4 4M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" stroke="#e5484d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Sign out</button>
        </div>
      }
    </div>
  </div>
</header>

<main class="content">
  <router-outlet></router-outlet>
</main>
